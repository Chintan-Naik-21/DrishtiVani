name: CI Pipeline (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ----------------------------------------------------
  # Job 1: Lint & Build Frontend (Next.js / TypeScript)
  # ----------------------------------------------------
  frontend-check:
    name: Frontend Lint & Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Cache will automatically activate once pnpm-lock.yaml is committed
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}

      - name: Install Dependencies
        shell: pwsh
        run: |
          if (Test-Path "pnpm-lock.yaml") {
            pnpm install --frozen-lockfile
          } elseif (Test-Path "package.json") {
            pnpm install
          } else {
            Write-Host "No package.json or pnpm-lock.yaml found yet. Skipping dependency install."
          }

      - name: Check TypeScript & Linting
        shell: pwsh
        run: |
          if (Test-Path "package.json") {
            $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
            if ($pkg.scripts.lint) {
              pnpm run lint
            } else {
              Write-Host "No lint script defined in package.json. Skipping."
            }
          } else {
            Write-Host "No package.json found. Skipping linting."
          }

      - name: Build Applications
        shell: pwsh
        run: |
          if (Test-Path "package.json") {
            $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
            if ($pkg.scripts.build) {
              pnpm run build
            } else {
              Write-Host "No build script defined in package.json. Skipping."
            }
          } else {
            Write-Host "No package.json found. Skipping build."
          }
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

  # ----------------------------------------------------
  # Job 2: Test & Lint Backend (Python / FastAPI)
  # ----------------------------------------------------
  backend-check:
    name: Backend Lint & Tests (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ${{ hashFiles('requirements.txt') != '' && 'pip' || '' }}

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install flake8 pytest

      - name: Lint with Flake8
        shell: pwsh
        run: |
          $pyFiles = Get-ChildItem -Filter *.py -Recurse -File -Exclude .git
          if ($pyFiles) {
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
            flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          } else {
            Write-Host "No Python files found yet. Skipping Flake8 linting."
          }

      - name: Run Tests with Pytest
        shell: pwsh
        run: |
          $testFiles = Get-ChildItem -Filter test_*.py -Recurse -File -Exclude .git
          if ($testFiles -or (Test-Path "tests")) {
            pytest -v
          } else {
            Write-Host "No test files found yet. Skipping pytest."
          }
        continue-on-error: true