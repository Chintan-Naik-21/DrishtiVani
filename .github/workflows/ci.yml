name: CI Pipeline (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ----------------------------------------------------
  # Job 1: Lint & Build Frontend (Next.js / TypeScript)
  # ----------------------------------------------------
  frontend-check:
    name: Frontend Lint & Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript & Linting
        shell: pwsh
        run: pnpm run lint

      - name: Build Applications
        shell: pwsh
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"

  # ----------------------------------------------------
  # Job 2: Test & Lint Backend (Python / FastAPI)
  # ----------------------------------------------------
  backend-check:
    name: Backend Lint & Tests (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Removed cache: 'pip' to prevent failure when requirements.txt does not exist yet

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install flake8 pytest

      - name: Lint with Flake8
        shell: pwsh
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Tests with Pytest
        shell: pwsh
        run: |
          pytest -v
        continue-on-error: true